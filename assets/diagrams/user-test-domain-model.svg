<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Let users from the code data model based on their actual use model, by observing it</title>
  <desc id="desc">Observing scientists reveals that multiple labels should point to an image instead of forcing it into one category. The revised model has higher usability.</desc>
  <metadata>Font Awesome Free 5.15.4 listening-ear and regular eye icons: https://fontawesome.com/license/free (CC BY 4.0).</metadata>
  <rect width="1000" height="350" rx="18" fill="white"/>
  <text x="34" y="45" fill="#3a9ebf" font-family="Arial, sans-serif" font-size="21" font-weight="700">Let users from the code data model based on their actual use model, by observing it</text>

  <rect x="31" y="85" width="250" height="176" rx="12" fill="#bd2298" fill-opacity=".09" stroke="#bd2298" stroke-width="2"/>
  <text x="156" y="118" text-anchor="middle" fill="#bd2298" font-family="Arial, sans-serif" font-size="18" font-weight="700">Initial assumption</text>
  <rect x="49" y="141" width="60" height="60" rx="7" fill="#bd2298" fill-opacity=".14" stroke="#bd2298"/>
  <text x="79" y="177" text-anchor="middle" fill="#bd2298" fill-opacity=".75" font-family="Arial, sans-serif" font-size="13">Image</text>
  <path d="M115 171h22m-8-8 8 8-8 8" fill="none" stroke="#bd2298" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="143" y="144" width="119" height="54" rx="7" fill="#bd2298" fill-opacity=".15" stroke="#bd2298"/>
  <text x="203" y="166" text-anchor="middle" fill="#bd2298" fill-opacity=".85" font-family="Arial, sans-serif" font-size="12">single Category</text>
  <text x="203" y="182" text-anchor="middle" fill="#bd2298" fill-opacity=".85" font-family="Arial, sans-serif" font-size="12">only</text>
  <text x="156" y="234" text-anchor="middle" fill="#bd2298" fill-opacity=".75" font-family="Arial, sans-serif" font-size="14">one category per image</text>
  <path d="M156 272v20m-9-9 9 9 9-9" fill="none" stroke="#e80036" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="156" y="325" text-anchor="middle" fill="#e80036" fill-opacity=".75" font-family="Arial, sans-serif" font-size="18" font-weight="700">usability: low</text>

  <path d="M286 174h55m-11-10 11 10-11 10" fill="none" stroke="#3a9ebf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="349" y="103" width="281" height="142" rx="12" fill="#3a9ebf"/>
  <text x="490" y="139" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="18" font-weight="700">Observe real tasks</text>
