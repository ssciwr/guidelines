  <text x="823" y="118" text-anchor="middle" fill="#3a9ebf" font-family="Arial, sans-serif" font-size="18" font-weight="700">Revised model</text>
  <rect x="696" y="143" width="96" height="27" rx="12" fill="#3a9ebf" fill-opacity=".15" stroke="#3a9ebf"/>
  <text x="744" y="161" text-anchor="middle" fill="#3a9ebf" fill-opacity=".85" font-family="Arial, sans-serif" font-size="13">label A</text>
  <rect x="696" y="178" width="96" height="27" rx="12" fill="#3a9ebf" fill-opacity=".15" stroke="#3a9ebf"/>
  <text x="744" y="196" text-anchor="middle" fill="#3a9ebf" fill-opacity=".85" font-family="Arial, sans-serif" font-size="13">label B</text>
  <path d="M798 157h51m-9-8 9 8-9 8M798 192h51m-9-8 9 8-9 8" fill="none" stroke="#3a9ebf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="858" y="143" width="76" height="62" rx="7" fill="#3a9ebf" fill-opacity=".15" stroke="#3a9ebf"/>
  <text x="896" y="180" text-anchor="middle" fill="#3a9ebf" fill-opacity=".75" font-family="Arial, sans-serif" font-size="13">Image</text>
  <text x="823" y="234" text-anchor="middle" fill="#3a9ebf" fill-opacity=".75" font-family="Arial, sans-serif" font-size="14">multiple labels per image</text>
  <path d="M823 292v-20m-9 9 9-9 9 9" fill="none" stroke="#40b945" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="823" y="325" text-anchor="middle" fill="#40b945" fill-opacity=".8" font-family="Arial, sans-serif" font-size="18" font-weight="700">usability: High</text>
</svg>
